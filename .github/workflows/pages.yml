name: Deploy Crate Diggin to GitHub Pages
# v14.0 publication retry; push triggers a fresh deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Validate JavaScript and generate site
        env:
          SITE_URL: https://djnaoyaman.github.io/cratediggin
        run: |
          node --check dist/app.js
          node --check dist/art.js
          node --check dist/playlist.js
          python build.py
          python scripts/audit_editorial_depth.py
          python - <<'PY'
          import json
          from pathlib import Path
          tracks = json.loads(Path('tracks.json').read_text())
          assert len(tracks) >= 226, f'Expected at least 225 tracks, got {len(tracks)}'
          assert any(t['id'] == 'dj-shadow-the-number-song' for t in tracks), 'The Number Song missing from source'
          assert Path('dist/songs/dj-shadow-the-number-song.html').exists(), 'The Number Song page missing from build'
          assert 'dj-shadow-the-number-song' in Path('dist/tracks.js').read_text(), 'The Number Song missing from client catalog'
          expected_audio = {'dj-shadow-the-number-song': 'odlhSQqOXL8', 'dj-shadow-the-number-song-cut-chemist-remix': 'c0CKXOCOX3o'}
          for track_id, video_id in expected_audio.items():
              track = next(t for t in tracks if t['id'] == track_id)
              assert track['youtube']['id'] == video_id, f'Incorrect audio: {track_id}'
              assert Path(f'dist/songs/{track_id}.html').exists()
          assert all(t.get('youtube', {}).get('id') for t in tracks), 'Missing catalog audio'
          print('Both Number Song versions and all catalog audio IDs verified')
          PY
      - name: Audit catalog metadata and link integrity
        run: |
          python scripts/audit_catalog.py
          node scripts/verify_producer_features.js
          python scripts/verify_kiyo_import.py
          python -m py_compile scripts/audit_catalog.py build.py
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('dist')
          data = json.loads(Path('tracks.json').read_text())
          assert len(list((root/'songs').glob('*.html'))) == len(data), 'Generated HTML page count mismatch'
          assert len(list((root/'songs').glob('*.md'))) == len(data), 'Generated Markdown page count mismatch'
          assert len(list((root/'og').glob('*.png'))) == len(data), 'Generated social image count mismatch'
          html = (root/'index.html').read_text()
          assert '/cratediggin/songs/' in html, 'Project Pages links missing base path'
          assert '"//cratediggin/' not in html, 'Broken protocol-relative Pages URLs'
          assert 'src="/cratediggin/tracks.js' in html, 'Track data script URL incorrect'
          assert 'src="/cratediggin/app.js' in html, 'Player script URL incorrect'
          assert 'href="/cratediggin/apple-touch-icon-vinyl.png?v=original-20261016"' in html, 'Vinyl touch icon URL missing'
          assert html.count('rel="apple-touch-icon"') == 1, 'Duplicate Apple touch icon tags'
          assert (root/'apple-touch-icon-vinyl.png').exists(), 'Vinyl touch icon not generated'
          artist_pages = list((root/'artists').glob('*.html'))
          assert artist_pages, 'No crawlable artist pages generated'
          sitemap = (root/'sitemap.xml').read_text()
          assert all('/artists/'+p.name in sitemap for p in artist_pages), 'Artist page missing from sitemap'
          assert 'ARTIST INDEX' in html, 'Artist links missing from static home HTML'
          assert '/cratediggin/artists/' in html, 'Crawlable artist links missing from homepage'
          assert any('/cratediggin/artists/' in p.read_text() for p in (root/'songs').glob('*.html')), 'Crawlable song-to-artist links missing'
          assert '## Artists' in (root/'llms.txt').read_text(), 'AI discovery artist index missing'
          assert 'DIG DEEPER' in (root/'app.js').read_text(), 'Deep-dive UI missing'
          assert '制作の背景：サンプラーの制約が音楽になった' in (root/'tracks.js').read_text(), 'Deep-dive source content missing'
          import json
          tracks=json.loads((Path('tracks.json')).read_text())
          deepdives=json.loads((Path('editorial_deepdives.json')).read_text())
          pe={t['title'] for t in tracks if t['artist']=='Public Enemy'}
          covered={d['title'] for d in deepdives if d['artist']=='Public Enemy' and len(d['sections'])>=3}
          assert pe == covered, f'Public Enemy editorial coverage mismatch: {pe ^ covered}'
          gs={t['title'] for t in tracks if t['artist']=='Gang Starr'}
          gs_covered={d['title'] for d in deepdives if d['artist']=='Gang Starr' and len(d['sections'])>=3}
          assert len(gs)==22 and gs==gs_covered, f'Gang Starr editorial coverage mismatch: {gs ^ gs_covered}'
          assert 'dj-shadow-the-number-song' in (root/'tracks.js').read_text()
          print('Generated pages, social cards, URLs and Number Song verified')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
