name: Deploy Crate Diggin to GitHub Pages
# v14.0 publication retry; push triggers a fresh deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Validate JavaScript and generate site
        env:
          SITE_URL: https://djnaoyaman.github.io/cratediggin
        run: |
          node --check dist/app.js
          node --check dist/art.js
          node --check dist/playlist.js
          python build.py
          python - <<'PY'
          import json
          from pathlib import Path
          tracks = json.loads(Path('tracks.json').read_text())
          assert len(tracks) >= 225, f'Expected at least 225 tracks, got {len(tracks)}'
          assert any(t['id'] == 'dj-shadow-the-number-song' for t in tracks), 'The Number Song missing from source'
          assert Path('dist/songs/dj-shadow-the-number-song.html').exists(), 'The Number Song page missing from build'
          assert 'dj-shadow-the-number-song' in Path('dist/tracks.js').read_text(), 'The Number Song missing from client catalog'
          print('The Number Song: source, page and client catalog verified')
          PY
      - name: Audit catalog metadata and link integrity
        run: |
          python scripts/audit_catalog.py
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('dist')
          data = json.loads(Path('tracks.json').read_text())
          assert len(list((root/'songs').glob('*.html'))) == len(data), 'Generated HTML page count mismatch'
          assert len(list((root/'songs').glob('*.md'))) == len(data), 'Generated Markdown page count mismatch'
          assert len(list((root/'og').glob('*.png'))) == len(data), 'Generated social image count mismatch'
          html = (root/'index.html').read_text()
          assert '/cratediggin/songs/' in html, 'Project Pages links missing base path'
          assert 'dj-shadow-the-number-song' in (root/'tracks.js').read_text()
          print('Generated pages, social cards, URLs and Number Song verified')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
