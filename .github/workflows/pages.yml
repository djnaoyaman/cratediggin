name: Incremental Crate Diggin publication
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-validation-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up patched Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify patched Node.js runtime
        run: node -e "if (process.versions.node !== '24.22.1') throw new Error('Unexpected Node.js runtime'); console.log(process.version)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified site outputs
        id: site-cache
        uses: actions/cache/restore@v4
        with:
          path: .build-cache
          key: ${{ runner.os }}-site-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-site-v1-
      - name: Select work from content fingerprints
        id: plan
        env:
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/build_pipeline.py plan --github-output "$GITHUB_OUTPUT"
      - name: Test build isolation and cache integrity
        run: python -m unittest discover -s scripts -p test_build_pipeline.py -v
      - name: Verify explicit unknown release metadata contracts
        run: python -m unittest discover -s scripts -p test_unknown_release_metadata.py -v
      - name: Preserve analytics, storage and player behavior when affected
        if: steps.plan.outputs.mode != 'profile' && steps.plan.outputs.mode != 'none'
        run: |
          node scripts/verify_ga_events.cjs
          node scripts/verify_analytics_privacy.cjs
          node scripts/verify_playlist_storage.cjs
          node scripts/verify_player_readiness.cjs
          node scripts/verify_seek.cjs
      - name: Install full-build dependencies
        if: steps.plan.outputs.full == 'true'
        run: |
          python -m pip install Pillow markdown-it-py==4.0.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Restore encoded images when relevant
        if: steps.plan.outputs.full == 'true'
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cratediggin-image-delivery-cache
          key: ${{ runner.os }}-image-delivery-${{ hashFiles('image_delivery.py') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-image-delivery-${{ hashFiles('image_delivery.py') }}-
      - name: Build selected outputs
        if: steps.plan.outputs.publish == 'true'
        run: python scripts/build_pipeline.py build
      - name: Validate authored profile and affected outputs
        if: steps.plan.outputs.publish == 'true'
        run: python scripts/validate_site.py --mode "${{ steps.plan.outputs.mode }}"
      - name: Cache browser runtime
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.mode != 'none'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.1
      - name: Verify profile text, links, display and navigation
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.mode != 'none'
        env:
          PROFILE_TEST_URL: http://127.0.0.1:8765/cratediggin
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          mkdir -p /tmp/crate-preview
          ln -s "$GITHUB_WORKSPACE/dist" /tmp/crate-preview/cratediggin
          python -m http.server 8765 --directory /tmp/crate-preview >/tmp/crate-preview.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node scripts/verify_profile_independent.cjs
          node scripts/verify_hybrid_overlay_browser.cjs
          node scripts/verify_seek_browser.cjs
          node scripts/verify_unknown_release_metadata_browser.cjs
          node scripts/verify_external_audio_browser.cjs
          node scripts/verify_lesson_original_attribution.cjs
          node scripts/verify_requested_notice_removal_browser.cjs
          node scripts/verify_year_region_display_browser.cjs
          node scripts/verify_user_selected_slum_videos_browser.cjs
          python scripts/verify_jurassic_feature.py --generated
          node scripts/verify_jurassic_feature_browser.cjs
          python scripts/verify_puts_feature.py --generated
          node scripts/verify_puts_feature_browser.cjs
          python scripts/verify_cut_producer_feature.py --generated
          node scripts/verify_cut_producer_feature_browser.cjs
          node scripts/verify_slum_village_feature.cjs
          CRATE_PREVIEW_URL=http://127.0.0.1:8765/cratediggin node scripts/verify_slum_village_feature_browser.cjs
      - name: Save validated site outputs
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.mode != 'none'
        run: python scripts/build_pipeline.py cache
      - uses: actions/cache/save@v4
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.mode != 'none' && steps.site-cache.outputs.cache-hit != 'true'
        with:
          path: .build-cache
          key: ${{ steps.site-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: steps.plan.outputs.full == 'true' && steps.image-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/cratediggin-image-delivery-cache
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
      - name: Save build report and profile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-build-report
          path: |
            /tmp/build-plan.json
            /tmp/build-plan.json.report.json
            /tmp/editor-profile-independent-*.png
            /tmp/hybrid-overlay-*.png
            /tmp/hybrid-overlay-report.json
            /tmp/seek-*.png
            /tmp/external-audio-*.png
            /tmp/jurassic-feature-*.png
            /tmp/puts-feature-*.png
            /tmp/cut-producer-feature-*.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && steps.plan.outputs.publish == 'true'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && needs.validate.outputs.publish == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Reject stale or non-main deployment
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Only the current main commit may deploy."
            exit 1
          fi
          remote_line="$(timeout 60 git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main)"
          read -r remote_sha remote_ref extra <<< "$remote_line"
          if [[ "$remote_ref" != "refs/heads/main" || -n "${extra:-}" || "$remote_sha" != "$GITHUB_SHA" || "$remote_line" == *$'\n'* ]]; then
            echo "::error::The deployment commit is not the current main commit."
            exit 1
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
