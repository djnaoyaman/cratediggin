name: Deploy Crate Diggin to GitHub Pages
# v14.0 publication retry; push triggers a fresh deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact comparison commit for targeted validation
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-validation-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select directly affected checks
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        run: |
          python scripts/ci/select_checks.py --repo . --base "$CI_BASE_SHA" --candidate "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --output /tmp/ci-selection.json --github-output "$GITHUB_OUTPUT"
      - name: Install build dependencies
        if: steps.select.outputs.build_required == 'true'
        run: |
          python -m pip install Pillow markdown-it-py==4.0.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Restore verified image encoding cache
        if: steps.select.outputs.build_required == 'true'
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cratediggin-image-delivery-cache
          key: ${{ runner.os }}-image-delivery-${{ hashFiles('image_delivery.py') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-image-delivery-${{ hashFiles('image_delivery.py') }}-
      - name: Generate validated deployment artifact
        if: steps.select.outputs.build_required == 'true'
        env:
          SITE_URL: https://djnaoyaman.github.io/cratediggin
        run: python build.py
      - name: Check affected syntax and generated integrity
        run: python scripts/ci/run_checks.py --plan /tmp/ci-selection.json --stage integrity
      - name: Run directly related source checks
        run: python scripts/ci/run_checks.py --plan /tmp/ci-selection.json --stage static
      - name: Save verified image encoding cache
        if: steps.select.outputs.build_required == 'true' && steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/cratediggin-image-delivery-cache
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
      - name: Verify affected browser behavior
        if: steps.select.outputs.browser_required == 'true'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p /tmp/crate-preview
          ln -s "$GITHUB_WORKSPACE/dist" /tmp/crate-preview/cratediggin
          python -m http.server 8765 --directory /tmp/crate-preview >/tmp/crate-preview.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          python scripts/ci/run_checks.py --plan /tmp/ci-selection.json --stage browser
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listening-shelf-screenshots
          path: |
            /tmp/ci-selection*.json
            /tmp/listening-shelf-*.png
            /tmp/catalog-pagination-*.png
            /tmp/graffiti-*.png
            /tmp/feature-portrait-*.png
            /tmp/feature-swipe-*.png
            /tmp/social-sharing-*.png
            /tmp/crawl-artwork-*.png
            /tmp/requested-four-*.png
            /tmp/requested-six-*.png
            /tmp/artifacts-credit-*.png
            /tmp/timeline-explorer-*.png
            /tmp/requested-two-*.png
            /tmp/ini-japan-media-*.png
            /tmp/editorial-remediation-*.png
            /tmp/producer-collage-*.png
            /tmp/bookmark-*.png
            /tmp/browse-spacing-*.png
            /tmp/premier-feature-*.png
            /tmp/editor-photo-*.png
            /tmp/tracks-gallery-*.png
            /tmp/opening-context-*.png
            /tmp/compact-list-*.png
            /tmp/compact-dilla-*.png
            /tmp/migration-navigation-*.png
            /tmp/editor-profile-*.png
            /tmp/producer-note-*.png
            /tmp/inline-bandcamp-*.png
            /tmp/section-references-*.png
            /tmp/art-crate-*.png
            /tmp/dj-shadow-cut-chemist-*.png
            /tmp/live-video-*.png
            /tmp/work-label-*.png
            /tmp/donuts-album-*.png
            /tmp/player-intent-*.png
            /tmp/player-presentation-*.png
            /tmp/renewal-*.png
            /tmp/visible-art-*.png
            /tmp/art-modes-*.png
            /tmp/art-landscape-*.png
            /tmp/navigation-hotfix-*.png
            /tmp/responsive-renewal-*.png
            /tmp/crate-naming-*.png
            /tmp/mix-enrichment-*.png
            /tmp/shadow-personal-*.png
            /tmp/shadow-photos-*.png
            /tmp/common-celebrate-*.png
            /tmp/kid-cudi-make-her-say-*.png
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Reject stale or non-main deployment
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Only the current main commit may deploy."
            exit 1
          fi
          remote_line="$(timeout 60 git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main)"
          read -r remote_sha remote_ref extra <<< "$remote_line"
          if [[ "$remote_ref" != "refs/heads/main" || -n "${extra:-}" || "$remote_sha" != "$GITHUB_SHA" || "$remote_line" == *$'\n'* ]]; then
            echo "::error::The deployment commit is not the current main commit."
            exit 1
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
